# operator v26.2.1-beta.2: NodePool was renamed to RedpandaBrokerPool, and the
# per-broker concerns rackAwareness / rbac / tls / external moved here from
# StretchCluster. clusterRef.kind must be set to StretchCluster (it defaults to
# "Redpanda" otherwise). Filename kept as nodepool-* for continuity with the README.
# rp-eu is the 1-broker tiebreaker in the 2 / 2 / 1 layout.
apiVersion: cluster.redpanda.com/v1alpha2
kind: RedpandaBrokerPool
metadata:
  name: rp-eu
  namespace: redpanda
spec:
  clusterRef:
    group: cluster.redpanda.com
    kind: StretchCluster
    name: redpanda
  replicas: 1
  image:
    repository: redpandadata/redpanda
    tag: v26.1.6
  rbac:
    enabled: true
  external:
    enabled: false
  rackAwareness:
    enabled: true
    nodeAnnotation: topology.kubernetes.io/region   # rack = cloud region
  tls:
    enabled: true
    certs:
      default:
        caEnabled: true
  services:
    perPod:
      remote:
        enabled: true                   # render per-pool Services for remote pools too

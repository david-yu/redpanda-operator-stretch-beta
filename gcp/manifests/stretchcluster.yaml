apiVersion: cluster.redpanda.com/v1alpha2
kind: StretchCluster
metadata:
  name: redpanda
  namespace: redpanda
spec:
  # NOTE (operator v26.2.1-beta.2 API): the per-broker concerns rbac, external,
  # rackAwareness, and tls are NOT on StretchCluster anymore — they live on each
  # RedpandaBrokerPool (the kind that replaced NodePool). StretchCluster now only
  # carries the cluster-wide settings: networking, enterprise license, and config.
  networking:
    crossClusterMode: flat              # operator manages headless Services + EndpointSlices
  enterprise:
    licenseSecretRef:
      name: redpanda-license
      key: license.key
  # Cluster-level Redpanda config. spec.config.cluster is an open map
  # (x-kubernetes-preserve-unknown-fields) that flows directly into the
  # broker's bootstrap.yaml.
  config:
    cluster:
      # Ordered failover preference. Redpanda 26.1+ accepts two formats:
      #   - "racks:<r1>,<r2>,…"          — distributes leaders equally across
      #                                    listed racks (no priority order)
      #   - "ordered_racks:<r1>,<r2>,…"  — places leaders in the FIRST listed
      #                                    rack with reachable brokers, failing
      #                                    over to <r2>, <r3>, … if higher-
      #                                    priority racks are all unavailable
      # https://docs.redpanda.com/current/develop/produce-data/leader-pinning/
      #
      # We use ordered_racks so a primary-region outage relocates leaders to
      # us-central1 (the failover region in gcp/terraform-failover) first,
      # then us-west1 and us-east4 as last resorts. All four GCP regions
      # are within the US so the cross-region RTT issue that bites AWS does
      # not apply here, but the ordering still keeps demos predictable.
      default_leaders_preference: "ordered_racks:us-east1,us-central1,us-west1,us-east4"
      # Time a broker can be unreachable before it's marked unavailable for
      # partition movement. 10 min so Demo A's "scale region to 0 → restore"
      # cycle finishes before the autobalancer marks the brokers unavailable.
      # Default: 900s. Raise further for production.
      partition_autobalancing_node_availability_timeout_sec: 600
      # Time a broker can stay unavailable before the autobalancer issues a
      # decommission for it. Must be > the availability timeout above. Demo B
      # observes the autodecom kicking in once a broker stays unavailable past
      # this threshold; expect to wait ~15 min into Demo B for the
      # `MEMBERSHIP=draining` state to appear. Default: 600s.
      partition_autobalancing_node_autodecommission_timeout_sec: 900
